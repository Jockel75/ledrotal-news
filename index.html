<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledrotal Zeitung">
<title>Ledrotal Zeitung</title>
<style>
:root{--paper:#f7f5ef;--ink:#171717;--muted:#6c6962;--rule:#d9d5ca;--rust:#a84f36;--card:#fffdfa;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}button{font:inherit}.app{max-width:720px;margin:auto;padding-bottom:calc(74px + var(--safe));min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--rule);padding:13px 16px 9px}.kicker{text-align:center;font:600 12px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.brand{text-align:center;font:700 38px/.98 Georgia,serif;letter-spacing:-.035em;margin:3px 0 2px}.sub{text-align:center;font:italic 14px Georgia,serif;color:var(--muted)}.edition{display:flex;justify-content:space-between;margin-top:11px;font-size:12px;color:var(--muted)}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rust);margin-right:6px}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 14px 8px;border-bottom:1px solid var(--rule);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--rule);background:transparent;padding:8px 13px;border-radius:999px;white-space:nowrap;font-weight:650}.chip.active{background:#161616;color:white;border-color:#161616}
main{padding:0 14px}.hint{margin:13px 0;background:#ece8dd;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.35}.hero{margin:14px 0 20px;padding-bottom:18px;border-bottom:1px solid var(--rule);cursor:pointer}.visual{height:250px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#91a6ae,#dacba7)}.visual:before,.thumb:before{content:"";position:absolute;inset:auto -6% -18% -6%;height:55%;background:#557d86;border-radius:50% 50% 0 0/35% 35% 0 0;opacity:.9}.visual:after{content:"";position:absolute;left:3%;bottom:34%;width:0;height:0;border-left:155px solid transparent;border-right:155px solid transparent;border-bottom:160px solid #637262;filter:drop-shadow(120px 20px 0 #80886d)}.badge{position:absolute;left:14px;bottom:12px;z-index:2;background:rgba(255,255,255,.94);padding:7px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.tag{color:var(--rust);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-top:13px}h1{font:700 32px/1.03 Georgia,serif;letter-spacing:-.028em;margin:5px 0 8px}.dek{font:400 17px/1.42 Georgia,serif;color:#34322e;margin:0 0 10px}.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}.meta b{color:var(--ink)}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:24px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:6px}.sectionhead h2{font:700 23px Georgia,serif;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.story{display:grid;grid-template-columns:1fr 112px;gap:13px;padding:15px 0;border-bottom:1px solid var(--rule);cursor:pointer}.story h3{font:700 21px/1.08 Georgia,serif;letter-spacing:-.015em;margin:4px 0 7px}.story p{font:400 15px/1.36 Georgia,serif;margin:0 0 8px;color:#3c3934}.thumb{height:98px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(145deg,#99a98e,#d4c4a4)}.thumb.water{background:linear-gradient(#c1d5dc 0 45%,#5f8792 45%)}.thumb.market{background:linear-gradient(145deg,#dbc6a6,#9b6c4a)}.thumb.house{background:linear-gradient(145deg,#c5b49f,#7c6856)}.thumb.culture{background:linear-gradient(145deg,#574c66,#b38362)}.thumb.forest{background:linear-gradient(145deg,#90a37f,#475d4c)}
.empty{text-align:center;color:var(--muted);padding:38px 15px;font:italic 16px Georgia,serif}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(720px,100%);height:calc(66px + var(--safe));padding-bottom:var(--safe);background:rgba(250,249,246,.97);backdrop-filter:blur(15px);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:650;padding:8px 1px}.nav span{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}.nav.active{color:var(--ink)}
.viewer{display:none;position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto}.viewer.show{display:block}.viewerbar{position:sticky;top:0;z-index:3;height:52px;background:rgba(247,245,239,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.viewerbar button{border:0;background:transparent;padding:8px;font-weight:700}.viewerbar b{font:700 16px Georgia,serif}.article{max-width:670px;margin:auto;padding:19px 18px 70px}.article h2{font:700 37px/1.03 Georgia,serif;letter-spacing:-.03em;margin:5px 0 11px}.lead{font:400 20px/1.43 Georgia,serif;color:#33312d;margin:0 0 15px}.by{font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:19px}.article p{font:400 18px/1.62 Georgia,serif;margin:0 0 19px}.source{background:#eeebe3;border-left:3px solid #273d52;padding:12px 14px;margin:24px 0;font-size:13px;line-height:1.45}.source a{color:#193d63}
@media(max-width:679px){.article h2{font-size:30px}}
@media(min-width:680px){.visual{height:330px}.story{grid-template-columns:1fr 150px}.thumb{height:112px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="kicker" id="kicker">La Gazzetta della Casa Stawole</div><div class="brand" id="brand">Ledrotal Zeitung</div><div class="sub" id="subtitle">Ledro · Garda · Trentino · Italien</div><div class="edition"><span id="date">–</span><span class="live" id="editionLabel">Mobile Ausgabe</span></div></header>
<div class="chips" id="chips"></div>
<main><div class="hint"><b>Wie eine App nutzen:</b> Auf dem iPhone in Safari „Teilen“ → „Zum Home-Bildschirm“.</div><div id="feed"><div class="empty">Nachrichten werden geladen …</div></div></main>
</div>
<nav class="bottom"><button class="nav active" data-section="Heute"><span>⌂</span>Heute</button><button class="nav" data-section="Ledrotal"><span>●</span>Ledro</button><button class="nav" data-section="Verkehr"><span>↗</span>Anreise</button><button class="nav" data-section="Kultur"><span>♫</span>Kultur</button><button class="nav" data-section="Haus & Alltag"><span>⌁</span>Alltag</button></nav>
<div class="viewer" id="viewer"><div class="viewerbar"><button id="back">‹ Zurück</button><b>Ledrotal Zeitung</b><button id="share">Teilen</button></div><div class="article" id="article"></div></div>
<script>
let DATA=null,current='Heute',currentStory=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function load(){try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);DATA=await r.json();setup();}catch(e){document.getElementById('feed').innerHTML='<div class="empty">news.json konnte nicht geladen werden. Bitte später neu laden.</div>';}}
function setup(){const e=DATA.edition||{};kicker.textContent=e.kicker||'';brand.textContent=e.brand||'Ledrotal Zeitung';subtitle.textContent=e.subtitle||'';date.textContent=e.date||'';editionLabel.textContent=e.label||'Mobile Ausgabe';const c=document.getElementById('chips');c.innerHTML='';(DATA.sections||['Heute']).forEach((s,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' active':'');b.textContent=s;b.onclick=()=>select(s,b);c.appendChild(b)});render();if(location.hash)open(location.hash.slice(1),true)}
function select(section,btn){current=section;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.section===section));render();window.scrollTo({top:0,behavior:'smooth'})}
function stories(){let s=[...(DATA.stories||[])].sort((a,b)=>(b.priority||0)-(a.priority||0));return current==='Heute'?s:s.filter(x=>x.section===current||x.tag===current)}
function visualClass(s){return ['water','market','house','culture','forest'].includes(s.imageStyle)?s.imageStyle:''}
function render(){const list=stories(),feed=document.getElementById('feed');if(!list.length){feed.innerHTML='<div class="empty">In diesem Ressort gibt es in dieser Ausgabe keine eigene Meldung.</div>';return}let html='';const hero=list.find(x=>x.hero)||list[0];if(current==='Heute'){html+=`<section class="hero" data-id="${esc(hero.id)}"><div class="visual"><span class="badge">Top-Meldung · ${esc(hero.section)}</span></div><div class="tag">${esc(hero.tag)}</div><h1>${esc(hero.title)}</h1><p class="dek">${esc(hero.teaser)}</p><div class="meta"><b>${esc(hero.status)}</b><span>·</span><span>${esc(hero.readTime)}</span><span>·</span><span>${esc(hero.source)}, ${esc(hero.date)}</span></div></section><div class="sectionhead"><h2>Heute im Tal</h2><span>lokal zuerst</span></div>`}const rest=current==='Heute'?list.filter(x=>x.id!==hero.id):list;html+=rest.map(s=>`<article class="story" data-id="${esc(s.id)}"><div><div class="tag">${esc(s.tag)}</div><h3>${esc(s.title)}</h3><p>${esc(s.teaser)}</p><div class="meta"><b>${esc(s.status)}</b><span>· ${esc(s.readTime)}</span></div></div><div class="thumb ${visualClass(s)}"></div></article>`).join('');feed.innerHTML=html;feed.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>open(el.dataset.id))}
function open(id,skipPush=false){const s=(DATA.stories||[]).find(x=>x.id===id);if(!s)return;currentStory=s;document.getElementById('article').innerHTML=`<div class="tag">${esc(s.tag)}</div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.teaser)}</p><div class="by"><b>${esc(s.status)}</b> · ${esc(s.source)} · ${esc(s.date)} · ${esc(s.readTime)}</div>${(s.body||[]).map(p=>`<p>${esc(p)}</p>`).join('')}<div class="source"><b>Quelle:</b> ${esc(s.source)}${s.url?`<br><a href="${esc(s.url)}" target="_blank" rel="noopener">Originalquelle öffnen</a>`:''}</div>`;viewer.classList.add('show');document.body.style.overflow='hidden';if(!skipPush)history.pushState({article:id},'', '#'+id)}
function close(skip=false){viewer.classList.remove('show');document.body.style.overflow='';currentStory=null;if(!skip&&location.hash)history.back()}
back.onclick=()=>close();share.onclick=async()=>{if(!currentStory)return;const payload={title:currentStory.title,text:currentStory.teaser,url:location.href};if(navigator.share){try{await navigator.share(payload)}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert('Link kopiert.')}catch(e){}}};window.addEventListener('popstate',()=>{if(viewer.classList.contains('show'))close(true)});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{const s=b.dataset.section;const chip=[...document.querySelectorAll('.chip')].find(x=>x.textContent===s);if(chip)select(s,chip);else{current=s;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));render();window.scrollTo({top:0,behavior:'smooth'})}});load();
</script>
</body>
</html>
